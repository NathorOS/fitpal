<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos pendientes · Nathor Fit</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1f1b16;--mut:#6b6359;--ac:#e0a800;--ok:#2e7d32;--bd:#e4dccb}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--card:#221e17;--tx:#f2ece0;--mut:#a89f8f;--bd:#3a3326}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 14px}
.barra{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.barra b{display:block;margin-bottom:6px}.pista{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.pista i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.top{display:flex;gap:12px;align-items:flex-start}
.top input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--ok)}
.t{font-weight:700;font-size:18px;margin-bottom:4px}h2{font-size:17px;margin:26px 0 0;padding-top:6px;border-top:2px solid var(--ac)}.f{margin-left:0!important}.f{display:inline-block;background:var(--ac);color:#1f1b16;font:600 13px/1 ui-monospace,monospace;padding:4px 8px;border-radius:6px;margin-left:6px}
.card.hecho{opacity:.55}.card.hecho .t{text-decoration:line-through}.card.hecho .cuerpo{display:none}
.adj{margin:10px 0;padding:8px 10px;border-left:4px solid var(--ac);background:rgba(224,168,0,.12);border-radius:6px;font-size:15px}
.nota{color:var(--mut);font-size:14px;margin:6px 0}
pre{white-space:pre-wrap;word-wrap:break-word;background:rgba(127,127,127,.12);padding:10px;border-radius:8px;font:14px/1.45 system-ui,sans-serif;margin:8px 0;max-height:260px;overflow:auto}
button{font:600 15px system-ui;min-height:44px;padding:0 16px;border:0;border-radius:99px;background:var(--ac);color:#1f1b16;cursor:pointer}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--bd);min-height:36px;font-size:13px;margin-top:20px}
.ok{background:var(--ok);color:#fff}
</style></head><body><main>
<h1>Pedidos pendientes para Gemini</h1>
<p class="s"><b>Casi terminado.</b> Ya están hechas la etapa 3 (menos festejando), la etapa 5 completa, el cuarto ordenado y las manchas. Solo faltan estos pedidos.</p>
<div class="barra"><b id="cuenta"></b><div class="pista"><i id="rel"></i></div></div>
<div id="lista"></div>
<button class="sec" id="reset">Destildar todo</button>
</main>
<script>
const ITEMS=[{"n": 1, "nota": "Hacelo una vez en un chat nuevo. Después, los dos pedidos de etapa 3 festejando son solo texto.", "adj": "`personaje-ficha.jpg` (solo acá, una vez). Opcional: también `e1-contento.jpg`.", "grupo": "Paso 0 · Preparar el chat (único con adjunto)", "titulo": "Presentar al personaje", "archivo": "(no genera imagen)", "txt": "Te adjunto la ficha de un personaje original de dibujo animado. Es el protagonista de todas las imágenes que te voy a pedir en este chat: tiene que ser SIEMPRE el mismo hombre (misma cara, ojos grandes y saltones con ojeras, nariz grande, pelo negro largo y desordenado, barba de días, piel amarilla, mismo trazo grueso y mismos colores). Recordalo y tomalo como referencia fija. Cada pedido va a empezar con un título entre corchetes, por ejemplo [ETAPA 3 · DE FIACA]. Respondé solo \"listo\", sin generar ninguna imagen todavía."}, {"n": 2, "nota": "", "adj": "Nada: se hace en el mismo chat.", "grupo": "Falta: etapa 3 festejando", "titulo": "ETAPA 3 · FESTEJANDO (CUMPLIÓ LA META)", "archivo": "e3-festejando", "txt": "[ETAPA 3 · FESTEJANDO (CUMPLIÓ LA META)]\nDibujá al personaje de la ficha de este chat (el mismo hombre, la misma cara, el mismo estilo).\n\nCuerpo: Está claramente más flaco que en la ficha: el ancho del torso y de la panza es un 25 % más angosto que en la ficha (que se note a simple vista). Panza chica y firme que ya no desborda la camiseta, sin papada, cara más angosta con las mejillas menos caídas, brazos, piernas y cuello más finos, la camiseta le queda justa y el jogging un poco holgado, barba un poco más corta.\nPose: Saltando con los dos brazos arriba, gritando de alegría, con la boca abierta.\n\nEl personaje: hombre argentino de unos 40 años, cara redonda, pelo negro largo y desordenado, barba de varios días, ojeras marcadas, expresión de cansado. Ropa: camiseta de fútbol de un solo color VERDE CHILLÓN puro (#00FF00), lisa, SIN franjas, SIN número, SIN escudo, SIN letras y SIN manchas (después la pintamos con los colores de cada equipo; las arrugas y sombras de la camiseta, en verdes más oscuros); jogging azul oscuro con manchas; zapatillas viejas.\n\nEstilo: ilustración original de dibujo animado satírico para adultos, con contorno negro grueso, piel de color amarillo intenso, ojos grandes, redondos y saltones con pupilas chiquitas, nariz grande y redondeada, colores algo apagados, sombras suaves, texturas de mugre y detalles desprolijos.\nFormato vertical 3:4. Cuerpo entero, de frente, centrado, ocupando el 85 % del alto de la imagen, con los pies cerca del borde de abajo. Mismo tamaño y misma escala que las otras imágenes del personaje.\nFondo de un solo color magenta puro (#FF00FF), plano, sin sombras, sin piso, sin degradé y sin ningún otro objeto. Que el magenta no aparezca en el personaje."}, {"n": 3, "nota": "Hacelo JUSTO después del pedido anterior, sin generar nada en el medio: usa esa última imagen.", "adj": "Nada: se hace en el mismo chat.", "grupo": "Falta: etapa 3 festejando", "titulo": "ETAPA 3 · FESTEJANDO · LIMPIO", "archivo": "e3-festejando-limpio", "txt": "[ETAPA 3 · FESTEJANDO · LIMPIO]\nTomá la última imagen que generaste y hacela de nuevo cambiando lo mínimo posible. Mantené EXACTAMENTE el mismo dibujo: misma cara, misma piel amarilla, mismo pelo, mismo cuerpo, misma pose, mismo trazo, mismos colores, mismo encuadre, mismo fondo magenta y la camiseta verde chillón. Lo único que cambia: sacale todas las manchas de mugre de la piel, de la camiseta, del jogging y de las zapatillas, y dejale el pelo un poco más prolijo. No la redibujes ni cambies al personaje."}, {"n": 4, "nota": "Las únicas con adjunto porque la etapa 1 ya existe. Si querés evitarlas, la app puede usar la versión con mugre.", "adj": "`e1-contento.jpg` (adjuntala en este mensaje).", "grupo": "Paso 5 · Opcional: etapa 1 limpia (con adjunto)", "titulo": "ETAPA 1 · CONTENTO · LIMPIO", "archivo": "e1-contento-limpio", "txt": "[ETAPA 1 · CONTENTO · LIMPIO]\nTe adjunto la imagen \"e1-contento\". Editala cambiando lo mínimo posible. Mantené EXACTAMENTE el mismo dibujo: misma cara, misma piel amarilla, mismo pelo, mismo cuerpo, misma pose, mismo trazo, mismos colores, mismo encuadre, mismo fondo magenta y la camiseta verde chillón. Lo único que cambia: sacale todas las manchas de mugre de la piel, de la camiseta, del jogging y de las zapatillas, y dejale el pelo un poco más prolijo. No la redibujes ni cambies al personaje."}, {"n": 5, "nota": "Las únicas con adjunto porque la etapa 1 ya existe. Si querés evitarlas, la app puede usar la versión con mugre.", "adj": "`e1-entrenando.jpg` (adjuntala en este mensaje).", "grupo": "Paso 5 · Opcional: etapa 1 limpia (con adjunto)", "titulo": "ETAPA 1 · ENTRENANDO · LIMPIO", "archivo": "e1-entrenando-limpio", "txt": "[ETAPA 1 · ENTRENANDO · LIMPIO]\nTe adjunto la imagen \"e1-entrenando\". Editala cambiando lo mínimo posible. Mantené EXACTAMENTE el mismo dibujo: misma cara, misma piel amarilla, mismo pelo, mismo cuerpo, misma pose, mismo trazo, mismos colores, mismo encuadre, mismo fondo magenta y la camiseta verde chillón. Lo único que cambia: sacale todas las manchas de mugre de la piel, de la camiseta, del jogging y de las zapatillas, y dejale el pelo un poco más prolijo. No la redibujes ni cambies al personaje."}, {"n": 6, "nota": "Las únicas con adjunto porque la etapa 1 ya existe. Si querés evitarlas, la app puede usar la versión con mugre.", "adj": "`e1-festejando.jpg` (adjuntala en este mensaje).", "grupo": "Paso 5 · Opcional: etapa 1 limpia (con adjunto)", "titulo": "ETAPA 1 · FESTEJANDO · LIMPIO", "archivo": "e1-festejando-limpio", "txt": "[ETAPA 1 · FESTEJANDO · LIMPIO]\nTe adjunto la imagen \"e1-festejando\". Editala cambiando lo mínimo posible. Mantené EXACTAMENTE el mismo dibujo: misma cara, misma piel amarilla, mismo pelo, mismo cuerpo, misma pose, mismo trazo, mismos colores, mismo encuadre, mismo fondo magenta y la camiseta verde chillón. Lo único que cambia: sacale todas las manchas de mugre de la piel, de la camiseta, del jogging y de las zapatillas, y dejale el pelo un poco más prolijo. No la redibujes ni cambies al personaje."}];
const K="nathor-pedidos-v4";let hechos=new Set();try{hechos=new Set(JSON.parse(localStorage.getItem(K)||"[]"))}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<b>$1</b>");
function pintar(){
 let gp="";document.getElementById("lista").innerHTML=ITEMS.map(o=>(o.grupo!==gp?(gp=o.grupo,`<h2>${esc(gp)}</h2>`):"")+`<section class="card ${hechos.has(o.n)?"hecho":""}" data-n="${o.n}">
 <div class="top"><input type="checkbox" aria-label="Hecho" ${hechos.has(o.n)?"checked":""}><div><div class="t">#${o.n} · ${esc(o.titulo)}</div><span class="f">guardar como: ${esc(o.archivo)}</span></div></div>
 <div class="cuerpo"><div class="adj"><b>Adjuntar:</b> ${md(o.adj)}</div>${o.nota?`<p class="nota">${md(o.nota)}</p>`:""}
 <pre>${esc(o.txt)}</pre><button data-copiar>Copiar pedido</button></div></section>`).join("");
 const h=ITEMS.filter(o=>hechos.has(o.n)).length;
 document.getElementById("cuenta").textContent=h+" de "+ITEMS.length+" hechos";
 document.getElementById("rel").style.width=(100*h/ITEMS.length)+"%";
}
function guardar(){try{localStorage.setItem(K,JSON.stringify([...hechos]))}catch(e){}pintar()}
document.addEventListener("change",e=>{const c=e.target.closest(".card");if(!c||e.target.type!=="checkbox")return;const n=+c.dataset.n;e.target.checked?hechos.add(n):hechos.delete(n);guardar()});
document.addEventListener("click",async e=>{
 if(e.target.id==="reset"){if(confirm("¿Destildar todo?")){hechos.clear();guardar()}return}
 const b=e.target.closest("[data-copiar]");if(!b)return;
 const o=ITEMS.find(x=>x.n==b.closest(".card").dataset.n);
 try{await navigator.clipboard.writeText(o.txt)}catch(_){const t=document.createElement("textarea");t.value=o.txt;document.body.append(t);t.select();document.execCommand("copy");t.remove()}
 b.textContent="¡Copiado!";b.classList.add("ok");setTimeout(()=>{b.textContent="Copiar pedido";b.classList.remove("ok")},1500)});
pintar();
</script></body></html>
