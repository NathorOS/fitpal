<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda · Nathor Fit</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1f1b16;--mut:#6b6359;--ac:#e0a800;--ok:#2e7d32;--bd:#e4dccb}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--card:#221e17;--tx:#f2ece0;--mut:#a89f8f;--bd:#3a3326}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 14px}
.barra{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.barra b{display:block;margin-bottom:6px}.pista{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.pista i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.top{display:flex;gap:12px;align-items:flex-start}
.top input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--ok)}
.t{font-weight:700;font-size:18px;margin-bottom:4px}h2{font-size:17px;margin:26px 0 0;padding-top:6px;border-top:2px solid var(--ac)}.f{margin-left:0!important}.f{display:inline-block;background:var(--ac);color:#1f1b16;font:600 13px/1 ui-monospace,monospace;padding:4px 8px;border-radius:6px;margin-left:6px}
.card.hecho{opacity:.55}.card.hecho .t{text-decoration:line-through}.card.hecho .cuerpo{display:none}
.adj{margin:10px 0;padding:8px 10px;border-left:4px solid var(--ac);background:rgba(224,168,0,.12);border-radius:6px;font-size:15px}
.nota{color:var(--mut);font-size:14px;margin:6px 0}
pre{white-space:pre-wrap;word-wrap:break-word;background:rgba(127,127,127,.12);padding:10px;border-radius:8px;font:14px/1.45 system-ui,sans-serif;margin:8px 0;max-height:260px;overflow:auto}
button{font:600 15px system-ui;min-height:44px;padding:0 16px;border:0;border-radius:99px;background:var(--ac);color:#1f1b16;cursor:pointer}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--bd);min-height:36px;font-size:13px;margin-top:20px}
.ok{background:var(--ok);color:#fff}
</style></head><body><main>
<h1>Ilustraciones para la tienda</h1>
<p class="s"><b>A:</b> accesorios, objetos para el cuarto, festejos y una pose bailando. <b>B:</b> 4 fondos nuevos. <b>C:</b> íconos de la tienda.</p>
<p class="s"><b>Cómo usarlo:</b> un chat nuevo de Gemini, todo en el mismo chat. Copiá, pegá y tildá cuando salga. Cuando termines, mandame las imágenes y las subo a Drive.</p>
<div class="barra"><b id="cuenta"></b><div class="pista"><i id="rel"></i></div></div>
<div id="lista"></div>
<button class="sec" id="reset">Destildar todo</button>
</main>
<script>
const ITEMS=[{"n": 1, "nota": "Es lo único con adjunto. Fija al personaje y el estilo: limpio, lindo y brillante. Si el chat se llena o el estilo cambia, abrí otro y repetí este paso.", "adj": "`e3-contento-limpio.jpg` (solo acá, una vez). Es el personaje en versión LIMPIA.", "grupo": "Paso 0 · Preparar el chat", "titulo": "PRESENTAR EL ESTILO", "archivo": "(no genera imagen)", "txt": "Te adjunto una imagen de un personaje original de dibujo animado. Vamos a hacer, en este mismo chat, todas las ilustraciones de una aplicación móvil para bajar de peso, con ese personaje como protagonista y un estilo de juego. Recordá dos cosas: 1) el personaje es SIEMPRE el mismo hombre (misma cara, ojos grandes y saltones con ojeras, nariz grande, pelo negro largo, piel amarilla, mismo trazo grueso); 2) TODAS las ilustraciones nuevas tienen que verse LIMPIAS, lindas y brillantes: sin mugre, sin manchas, sin telarañas y sin desgaste (la mugre, cuando haga falta, la agregamos nosotros después). Cada pedido empieza con un título entre corchetes. Respondé solo \"listo\", sin generar ninguna imagen todavía."}, {"grupo": "A · Para comprar en la tienda", "titulo": "HOJA T1 · ACCESORIOS PARA LA CABEZA", "archivo": "hoja-tienda-accesorios", "nota": "Van dibujados sueltos y DE FRENTE para ponerlos por código sobre la cabeza del personaje.", "adj": "Nada: se hace en el mismo chat.", "txt": "[HOJA T1 · ACCESORIOS PARA LA CABEZA]\nHoja de íconos para una aplicación móvil. Los 9 íconos, en orden:\n1) Una gorra con visera, vista de frente, de color azul\n2) Una vincha deportiva de toalla, vista de frente, blanca con una franja roja\n3) Un gorro de lana con pompón, visto de frente, naranja\n4) Un sombrero piluso de tela, visto de frente, beige\n5) Una corona dorada con piedras de colores, vista de frente\n6) Unos anteojos de sol negros, vistos de frente\n7) Unos anteojos de sol espejados celestes, vistos de frente\n8) Unos auriculares grandes de vincha, vistos de frente, rojos\n9) Un silbato plateado colgando de un cordón, visto de frente\n\nHoja cuadrada 1:1, grilla de 3 por 3 (se lee de izquierda a derecha y de arriba hacia abajo), cada ícono bien separado de los demás, sin tocarse ni superponerse, todos del mismo tamaño. Sin letras ni textos (solo los números que se pidan). Sin marcas reales, sin escudos y sin caras de personas reales. Ningún ícono usa magenta, rosa ni violeta.\n\nEstilo: ilustración de dibujo animado para una aplicación móvil, con el mismo trazo negro grueso y los mismos colores intensos que la imagen del personaje adjunta, pero LIMPIA Y LINDA: todo prolijo, nuevo y brillante, con un pequeño reflejo de luz, sin mugre, sin manchas, sin óxido, sin telarañas y sin desgaste. Cada ícono es un objeto o una escena simple, centrado, que se entienda de lejos y a tamaño chico y que dé ganas de tocarlo.\nFondo de un solo color magenta puro (#FF00FF), plano, sin sombras, sin piso, sin degradé y sin ningún otro objeto. Que el magenta no aparezca en el personaje.", "n": 2}, {"grupo": "A · Para comprar en la tienda", "titulo": "HOJA T2 · OBJETOS PARA EL CUARTO", "archivo": "hoja-tienda-cuarto", "nota": "Más cosas para decorar el cuarto. Todas sanas o lindas: nada de comida chatarra.", "adj": "Nada: se hace en el mismo chat.", "txt": "[HOJA T2 · OBJETOS PARA EL CUARTO]\nHoja de íconos para una aplicación móvil. Los 9 íconos, en orden:\n1) Una bolsa de boxeo roja colgando de una cadena\n2) Una colchoneta de yoga enrollada, celeste\n3) Una lámpara de pie con pantalla amarilla, encendida\n4) Una guirnalda de lucecitas amarillas encendidas\n5) Un estante de madera con libros y una plantita\n6) Un cuadro con un paisaje de montañas y un lago\n7) Un parlante con notas musicales saliendo\n8) Una pelota de fútbol clásica blanca y negra\n9) Una alfombra redonda tejida de colores\n\nHoja cuadrada 1:1, grilla de 3 por 3 (se lee de izquierda a derecha y de arriba hacia abajo), cada ícono bien separado de los demás, sin tocarse ni superponerse, todos del mismo tamaño. Sin letras ni textos (solo los números que se pidan). Sin marcas reales, sin escudos y sin caras de personas reales. Ningún ícono usa magenta, rosa ni violeta.\n\nEstilo: ilustración de dibujo animado para una aplicación móvil, con el mismo trazo negro grueso y los mismos colores intensos que la imagen del personaje adjunta, pero LIMPIA Y LINDA: todo prolijo, nuevo y brillante, con un pequeño reflejo de luz, sin mugre, sin manchas, sin óxido, sin telarañas y sin desgaste. Cada ícono es un objeto o una escena simple, centrado, que se entienda de lejos y a tamaño chico y que dé ganas de tocarlo.\nFondo de un solo color magenta puro (#FF00FF), plano, sin sombras, sin piso, sin degradé y sin ningún otro objeto. Que el magenta no aparezca en el personaje.", "n": 3}, {"grupo": "A · Para comprar en la tienda", "titulo": "HOJA T3 · FESTEJOS", "archivo": "hoja-tienda-festejos", "nota": "Efectos que se compran para cuando cumplís un reto.", "adj": "Nada: se hace en el mismo chat.", "txt": "[HOJA T3 · FESTEJOS]\nHoja de íconos para una aplicación móvil. Los 9 íconos, en orden:\n1) Un racimo de globos de colores (verde, azul, amarillo, naranja)\n2) Serpentinas de colores enruladas\n3) Papelitos blancos cayendo, como en la cancha\n4) Una corneta de plástico de cancha\n5) Un bombo con dos palillos\n6) Dos bengalas encendidas con chispas doradas\n7) Una lluvia de estrellas doradas\n8) Dos manos aplaudiendo\n9) Un arco iris chiquito con una nube en cada punta\n\nHoja cuadrada 1:1, grilla de 3 por 3 (se lee de izquierda a derecha y de arriba hacia abajo), cada ícono bien separado de los demás, sin tocarse ni superponerse, todos del mismo tamaño. Sin letras ni textos (solo los números que se pidan). Sin marcas reales, sin escudos y sin caras de personas reales. Ningún ícono usa magenta, rosa ni violeta.\n\nEstilo: ilustración de dibujo animado para una aplicación móvil, con el mismo trazo negro grueso y los mismos colores intensos que la imagen del personaje adjunta, pero LIMPIA Y LINDA: todo prolijo, nuevo y brillante, con un pequeño reflejo de luz, sin mugre, sin manchas, sin óxido, sin telarañas y sin desgaste. Cada ícono es un objeto o una escena simple, centrado, que se entienda de lejos y a tamaño chico y que dé ganas de tocarlo.\nFondo de un solo color magenta puro (#FF00FF), plano, sin sombras, sin piso, sin degradé y sin ningún otro objeto. Que el magenta no aparezca en el personaje.", "n": 4}, {"grupo": "A · Para comprar en la tienda", "titulo": "POSE EXTRA · BAILANDO", "archivo": "e3-bailando", "nota": "Festejo especial que se compra en la tienda.", "adj": "Nada: se hace en el mismo chat.", "txt": "[POSE EXTRA · BAILANDO]\nDibujá al personaje de la imagen adjunta al principio de este chat (el mismo hombre, la misma cara, el mismo estilo).\n\nCuerpo (etapa 3): Está claramente más flaco que en la imagen adjunta: panza chica y firme que no desborda la camiseta, sin papada, cara más angosta, brazos y piernas más finos, camiseta justa y jogging un poco holgado, barba corta. Está LIMPIO Y PROLIJO: sin manchas ni mugre en la piel, la camiseta, el jogging ni las zapatillas, el pelo ordenado.\nPose: Bailando feliz, un brazo arriba y una pierna levantada, con una gran sonrisa.\n\nEl personaje: hombre argentino de unos 40 años, cara redonda, pelo negro largo y SUELTO (sin colita), algo despeinado pero limpio, barba de varios días, ojeras marcadas, expresión un poco cansada. Ropa: camiseta de fútbol de un solo color VERDE CHILLÓN puro (#00FF00), lisa, SIN franjas, SIN número, SIN escudo, SIN letras y SIN manchas (después la pintamos con los colores de cada equipo; las arrugas y sombras de la camiseta, en verdes más oscuros); jogging azul oscuro limpio; zapatillas limpias.\n\nEstilo: ilustración original de dibujo animado satírico para adultos, igual que la imagen adjunta, con contorno negro grueso, piel de color amarillo intenso, ojos grandes, redondos y saltones, nariz grande y redondeada, colores intensos y sombras suaves, TODO LIMPIO: sin manchas, sin mugre y sin texturas sucias.\nFormato vertical 3:4. Cuerpo entero, de frente, centrado, ocupando el 85 % del alto de la imagen, con los pies cerca del borde de abajo. Mismo tamaño y misma escala que las otras imágenes del personaje.\nFondo de un solo color magenta puro (#FF00FF), plano, sin sombras, sin piso, sin degradé y sin ningún otro objeto. Que el magenta no aparezca en el personaje.", "n": 5}, {"grupo": "B · Fondos nuevos (en vez del cuarto)", "titulo": "FONDO · BALCÓN CON PARRILLA", "archivo": "fondo-balcon", "nota": "Un fondo grande para comprar. Mismo encuadre que el cuarto.", "adj": "Nada: se hace en el mismo chat.", "txt": "[FONDO · BALCÓN CON PARRILLA]\nIlustración de fondo para la pantalla principal de la aplicación, donde después se para el personaje. Un balcón de un departamento de ciudad con una parrilla chica de ladrillo, plantas en macetas, una reposera y vista a los edificios y al cielo celeste. Sin ninguna persona ni animal. Dejá libre el centro del piso, adelante, para poner al personaje. En algún lugar visible hay una bandera lisa de un solo color VERDE CHILLÓN puro (#00FF00), sin escudo ni letras (después la pintamos con los colores del equipo).\n\nEstilo: el mismo dibujo animado del personaje del principio de este chat, con contorno negro grueso y colores intensos, LIMPIO Y LINDO: todo prolijo, nuevo y brillante, sin mugre, sin manchas y sin desgaste. De día, con luz cálida.\nFormato horizontal 4:3, vista de frente un poco desde arriba, como un escenario. Sin letras, sin textos, sin marcas reales y sin escudos.", "n": 6}, {"grupo": "B · Fondos nuevos (en vez del cuarto)", "titulo": "FONDO · PATIO CON PILETA", "archivo": "fondo-patio", "nota": "Un fondo grande para comprar.", "adj": "Nada: se hace en el mismo chat.", "txt": "[FONDO · PATIO CON PILETA]\nIlustración de fondo para la pantalla principal de la aplicación, donde después se para el personaje. Un patio de casa con pasto, una pileta de lona azul con agua clara, una sombrilla y una mesa de jardín con una jarra de agua con limón. Sin ninguna persona ni animal. Dejá libre el centro del piso, adelante, para poner al personaje. En algún lugar visible hay una bandera lisa de un solo color VERDE CHILLÓN puro (#00FF00), sin escudo ni letras (después la pintamos con los colores del equipo).\n\nEstilo: el mismo dibujo animado del personaje del principio de este chat, con contorno negro grueso y colores intensos, LIMPIO Y LINDO: todo prolijo, nuevo y brillante, sin mugre, sin manchas y sin desgaste. De día, con luz cálida.\nFormato horizontal 4:3, vista de frente un poco desde arriba, como un escenario. Sin letras, sin textos, sin marcas reales y sin escudos.", "n": 7}, {"grupo": "B · Fondos nuevos (en vez del cuarto)", "titulo": "FONDO · GIMNASIO DE BARRIO", "archivo": "fondo-gimnasio", "nota": "Un fondo grande para comprar.", "adj": "Nada: se hace en el mismo chat.", "txt": "[FONDO · GIMNASIO DE BARRIO]\nIlustración de fondo para la pantalla principal de la aplicación, donde después se para el personaje. Un gimnasio de barrio chico, con piso de goma negro, un rack de pesas, mancuernas ordenadas, una bicicleta fija, un espejo en la pared y una ventana con luz. Sin ninguna persona ni animal. Dejá libre el centro del piso, adelante, para poner al personaje. En algún lugar visible hay una bandera lisa de un solo color VERDE CHILLÓN puro (#00FF00), sin escudo ni letras (después la pintamos con los colores del equipo).\n\nEstilo: el mismo dibujo animado del personaje del principio de este chat, con contorno negro grueso y colores intensos, LIMPIO Y LINDO: todo prolijo, nuevo y brillante, sin mugre, sin manchas y sin desgaste. De día, con luz cálida.\nFormato horizontal 4:3, vista de frente un poco desde arriba, como un escenario. Sin letras, sin textos, sin marcas reales y sin escudos.", "n": 8}, {"grupo": "B · Fondos nuevos (en vez del cuarto)", "titulo": "FONDO · PLAZA", "archivo": "fondo-plaza", "nota": "Un fondo grande para comprar.", "adj": "Nada: se hace en el mismo chat.", "txt": "[FONDO · PLAZA]\nIlustración de fondo para la pantalla principal de la aplicación, donde después se para el personaje. Una plaza de barrio con árboles, un camino de tierra para correr, aparatos para hacer ejercicio al aire libre, un banco de madera y un bebedero. Sin ninguna persona ni animal. Dejá libre el centro del piso, adelante, para poner al personaje. En algún lugar visible hay una bandera lisa de un solo color VERDE CHILLÓN puro (#00FF00), sin escudo ni letras (después la pintamos con los colores del equipo).\n\nEstilo: el mismo dibujo animado del personaje del principio de este chat, con contorno negro grueso y colores intensos, LIMPIO Y LINDO: todo prolijo, nuevo y brillante, sin mugre, sin manchas y sin desgaste. De día, con luz cálida.\nFormato horizontal 4:3, vista de frente un poco desde arriba, como un escenario. Sin letras, sin textos, sin marcas reales y sin escudos.", "n": 9}, {"grupo": "C · Íconos de la tienda", "titulo": "HOJA T4 · TIENDA", "archivo": "hoja-tienda-iconos", "nota": "Para la pantalla de la tienda: botones, precios y cosas bloqueadas.", "adj": "Nada: se hace en el mismo chat.", "txt": "[HOJA T4 · TIENDA]\nHoja de íconos para una aplicación móvil. Los 9 íconos, en orden:\n1) Un kiosco de barrio con toldo a rayas verdes y blancas (sin letras)\n2) Una bolsa de tela llena de monedas doradas\n3) Una pila de monedas doradas\n4) Un candado cerrado dorado\n5) Un candado abierto dorado\n6) Una etiqueta de precio colgando de un hilo (sin números)\n7) Un reloj de arena\n8) Una caja de regalo con moño\n9) Un megáfono (para los paquetes de frases)\n\nHoja cuadrada 1:1, grilla de 3 por 3 (se lee de izquierda a derecha y de arriba hacia abajo), cada ícono bien separado de los demás, sin tocarse ni superponerse, todos del mismo tamaño. Sin letras ni textos (solo los números que se pidan). Sin marcas reales, sin escudos y sin caras de personas reales. Ningún ícono usa magenta, rosa ni violeta.\n\nEstilo: ilustración de dibujo animado para una aplicación móvil, con el mismo trazo negro grueso y los mismos colores intensos que la imagen del personaje adjunta, pero LIMPIA Y LINDA: todo prolijo, nuevo y brillante, con un pequeño reflejo de luz, sin mugre, sin manchas, sin óxido, sin telarañas y sin desgaste. Cada ícono es un objeto o una escena simple, centrado, que se entienda de lejos y a tamaño chico y que dé ganas de tocarlo.\nFondo de un solo color magenta puro (#FF00FF), plano, sin sombras, sin piso, sin degradé y sin ningún otro objeto. Que el magenta no aparezca en el personaje.", "n": 10}];
const K="nathor-tienda-v1";let hechos=new Set();try{hechos=new Set(JSON.parse(localStorage.getItem(K)||"[]"))}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<b>$1</b>");
function pintar(){
 let gp="";document.getElementById("lista").innerHTML=ITEMS.map(o=>(o.grupo!==gp?(gp=o.grupo,`<h2>${esc(gp)}</h2>`):"")+`<section class="card ${hechos.has(o.n)?"hecho":""}" data-n="${o.n}">
 <div class="top"><input type="checkbox" aria-label="Hecho" ${hechos.has(o.n)?"checked":""}><div><div class="t">#${o.n} · ${esc(o.titulo)}</div><span class="f">guardar como: ${esc(o.archivo)}</span></div></div>
 <div class="cuerpo"><div class="adj"><b>Adjuntar:</b> ${md(o.adj)}</div>${o.nota?`<p class="nota">${md(o.nota)}</p>`:""}
 <pre>${esc(o.txt)}</pre><button data-copiar>Copiar pedido</button></div></section>`).join("");
 const h=ITEMS.filter(o=>hechos.has(o.n)).length;
 document.getElementById("cuenta").textContent=h+" de "+ITEMS.length+" hechos";
 document.getElementById("rel").style.width=(100*h/ITEMS.length)+"%";
}
function guardar(){try{localStorage.setItem(K,JSON.stringify([...hechos]))}catch(e){}pintar()}
document.addEventListener("change",e=>{const c=e.target.closest(".card");if(!c||e.target.type!=="checkbox")return;const n=+c.dataset.n;e.target.checked?hechos.add(n):hechos.delete(n);guardar()});
document.addEventListener("click",async e=>{
 if(e.target.id==="reset"){if(confirm("¿Destildar todo?")){hechos.clear();guardar()}return}
 const b=e.target.closest("[data-copiar]");if(!b)return;
 const o=ITEMS.find(x=>x.n==b.closest(".card").dataset.n);
 try{await navigator.clipboard.writeText(o.txt)}catch(_){const t=document.createElement("textarea");t.value=o.txt;document.body.append(t);t.select();document.execCommand("copy");t.remove()}
 b.textContent="¡Copiado!";b.classList.add("ok");setTimeout(()=>{b.textContent="Copiar pedido";b.classList.remove("ok")},1500)});
pintar();
</script></body></html>
