<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatito: boceto</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6faf8; color: #1d2b25; margin: 0; padding: 16px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p { color: #6b7c74; margin: 0 0 16px; }
    .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 900px; }
    .tarjeta { background: #fff; border-radius: 20px; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .tarjeta svg { width: 100%; height: auto; }
    .tarjeta b { display: block; margin-top: 4px; }
    .escena { margin-top: 16px; max-width: 420px; border-radius: 24px; overflow: hidden;
      background: linear-gradient(#cfeee0, #9fd8bf 70%, #2f9e6f 70%); padding: 24px 0 0; text-align: center; }
    .escena svg { width: 60%; }
  </style>
</head>
<body>
  <h1>Gatito de Nathor Fit: boceto 1</h1>
  <p>Estados animados. No es parte de la app, es solo para revisar el estilo.</p>
  <div class="grilla" id="grilla"></div>
  <div class="escena" id="escena"></div>
  <script type="module">
    import { gatoSVG, ESTADOS } from '../js/gato.js';
    const nombres = { normal: 'Normal', feliz: 'Contento', saluda: 'Saluda', siesta: 'Siesta', festeja: 'Festeja' };
    document.getElementById('grilla').innerHTML = ESTADOS
      .map(e => `<div class="tarjeta">${gatoSVG(e)}<b>${nombres[e]}</b></div>`).join('');
    document.getElementById('escena').innerHTML = gatoSVG('saluda');
  </script>
</body>
</html>
