<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="Contá calorías con un personaje bien argentino que no te deja aflojar. Todo gratis y guardado en tu teléfono.">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/arcade.css">
  <title>Nathor Fit</title>
</head>
<body>
  <main id="vista"></main>
  <div id="tabs" hidden>
    <div class="barra-inferior">
      <nav class="nav" aria-label="Secciones">
        <a href="#/hoy" aria-label="Hoy">
          <img class="nav__ico" src="img/iconos/hoy.webp" alt="" width="32" height="32">
        </a>
        <a href="#/retos" aria-label="Retos">
          <img class="nav__ico" src="img/iconos/retos.webp" alt="" width="32" height="32">
        </a>
        <a href="#/entrenador" aria-label="Entrenador">
          <img class="nav__ico" src="img/iconos/meta.webp" alt="" width="32" height="32">
        </a>
        <a href="#/progreso" aria-label="Progreso">
          <img class="nav__ico" src="img/iconos/progreso.webp" alt="" width="32" height="32">
        </a>
        <a href="#/perfil" aria-label="Perfil">
          <img class="nav__ico" src="img/iconos/perfil.webp" alt="" width="32" height="32">
        </a>
      </nav>
      <button class="fab" id="abrir-mas" aria-label="Agregar" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <dialog id="menu-mas" class="dialogo-mas" aria-label="Agregar">
    <div class="menu-mas">
      <div class="menu-mas__fila">
        <a data-ruta="/actividad" data-destino="" href="#/actividad"><img class="menu-mas__ico" src="img/iconos/actividad.webp" alt="" width="40" height="40">Actividad</a>
        <a data-ruta="/peso" data-destino="" href="#/peso"><img class="menu-mas__ico" src="img/iconos/peso.webp" alt="" width="40" height="40">Peso</a>
        <button type="button" data-agua><img class="menu-mas__ico" src="img/iconos/agua.webp" alt="" width="40" height="40">Agua +250</button>
        <a data-ruta="/ayuno" data-destino="" href="#/ayuno"><img class="menu-mas__ico" src="img/iconos/ayuno.webp" alt="" width="40" height="40">Ayuno</a>
      </div>
      <div class="menu-mas__fila">
        <a data-ruta="/entrenar" data-destino="" href="#/entrenar"><img class="menu-mas__ico" src="img/iconos/entrenar.webp" alt="" width="40" height="40">Entrenar</a>
        <a data-destino="modo=rapido" href="#/registrar?modo=rapido"><img class="menu-mas__ico" src="img/iconos/registro-rapido.webp" alt="" width="40" height="40">Rápido</a>
        <a data-destino="tab=mias" href="#/registrar?tab=mias"><img class="menu-mas__ico" src="img/iconos/favoritos.webp" alt="" width="40" height="40">Mis comidas</a>
        <a data-destino="modo=nuevo" href="#/registrar?modo=nuevo"><img class="menu-mas__ico" src="img/iconos/alimento-propio.webp" alt="" width="40" height="40">Crear alimento</a>
      </div>
      <div class="menu-mas__fila">
        <a data-destino="" href="#/registrar"><img class="menu-mas__ico" src="img/iconos/buscar.webp" alt="" width="40" height="40">Buscar</a>
        <a data-ruta="/ia" data-destino="modo=texto" href="#/ia?modo=texto"><img class="menu-mas__ico" src="img/iconos/anotar-comida.webp" alt="" width="40" height="40">Describir</a>
        <a data-ruta="/codigo" data-destino="" href="#/codigo"><img class="menu-mas__ico" src="img/iconos/codigo-barras.webp" alt="" width="40" height="40">Código</a>
      </div>
      <a data-ruta="/ia" data-destino="modo=foto" href="#/ia?modo=foto" class="menu-mas__principal"><img class="menu-mas__ico" src="img/iconos/foto-ia.webp" alt="" width="40" height="40">Foto con IA</a>
    </div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
