<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/estilos.css">
  <title>Nathor Fit</title>
</head>
<body>
  <main id="vista"></main>
  <div id="tabs" hidden>
    <div class="barra-inferior">
      <nav class="nav" aria-label="Secciones">
        <a href="#/hoy" aria-label="Hoy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-5.5h4V20h5V9.5"/></svg>
        </a>
        <a href="#/retos" aria-label="Retos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9Z"/><path d="m12 8 1.3 2.7 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4Z"/></svg>
        </a>
        <a href="#/progreso" aria-label="Progreso">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12"/><path d="M12 20V5"/><path d="M19 20v-9"/></svg>
        </a>
        <a href="#/perfil" aria-label="Perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </a>
      </nav>
      <button class="fab" id="abrir-mas" aria-label="Agregar" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <dialog id="menu-mas" class="dialogo-mas" aria-label="Agregar">
    <div class="menu-mas">
      <div class="menu-mas__fila">
        <a data-ruta="/actividad" data-destino="" href="#/actividad"><span class="emoji" aria-hidden="true">🏃</span>Actividad</a>
        <a data-ruta="/peso" data-destino="" href="#/peso"><span class="emoji" aria-hidden="true">⚖️</span>Peso</a>
        <button type="button" data-agua><span class="emoji" aria-hidden="true">💧</span>Agua +250</button>
        <a data-ruta="/ayuno" data-destino="" href="#/ayuno"><span class="emoji" aria-hidden="true">⏳</span>Ayuno</a>
      </div>
      <div class="menu-mas__fila">
        <a data-ruta="/entrenar" data-destino="" href="#/entrenar"><span class="emoji" aria-hidden="true">🏋️</span>Entrenar</a>
        <a data-destino="modo=rapido" href="#/registrar?modo=rapido"><span class="emoji" aria-hidden="true">⚡</span>Rápido</a>
        <a data-destino="tab=mias" href="#/registrar?tab=mias"><span class="emoji" aria-hidden="true">⭐</span>Mis comidas</a>
        <a data-destino="modo=nuevo" href="#/registrar?modo=nuevo"><span class="emoji" aria-hidden="true">✏️</span>Crear alimento</a>
      </div>
      <div class="menu-mas__fila">
        <a data-destino="" href="#/registrar"><span class="emoji" aria-hidden="true">🔎</span>Buscar</a>
        <a data-ruta="/ia" data-destino="modo=texto" href="#/ia?modo=texto"><span class="emoji" aria-hidden="true">💬</span>Describir</a>
        <a data-ruta="/codigo" data-destino="" href="#/codigo"><span class="emoji" aria-hidden="true">🏷️</span>Código</a>
      </div>
      <a data-ruta="/ia" data-destino="modo=foto" href="#/ia?modo=foto" class="menu-mas__principal"><span class="emoji" aria-hidden="true">📷</span>Foto con IA</a>
    </div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
